<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.86.0/dist/phaser.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            }
    </style>

    <title>Untitled</title>
</head>
<body>

<script>
var config = {
    type: Phaser.AUTO,
    width: 1200,
    height: 750,
    physics: { //Adds physics setting
        default: 'arcade', //Sets the default physic setting to arcade
        arcade: {
            gravity: { y: 450 }, //Makes the gravity of 450 so when the sprite falls it will drop down by about 450 untis
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};
//preloads images beforehand
var game = new Phaser.Game(config);
function preload() {
    this.load.image('bluesky', 'assets/bluesky.jpg'); //refers back to the bg of skyblue
    this.load.image('concrete1', 'assets/concrete1.png'); //refers back to the texture used for platforms
    this.load.image('player1', 'assets/player1.png') //refers back to sprite texture for player 1
    this.load.image('player2', 'assets/player2.png') //refers back to sprite texture for player 2
}

function create() {
    //background(placeholder for now not decided)
    var skyBg = this.add.image(600, 375, 'bluesky') //creates the variable then add image of the sky bg then resizes it to 1200, 750 so almost entirely the whole image will show
    skyBg.setDisplaySize(1200, 750);
    //platform(also undecided for now placeholder)
    var testplatform = this.physics.add.staticGroup() //staticGroup used for making the object sticking in one place so when other sprite is ontop of it, it wouldn't move
    var platform = testplatform.create(300, 500, 'concrete1')
    platform.displayWidth = 250;
    platform.displayHeight = 30;
    platform.refreshBody() //makes it so it updates based on the current physic setting
    var platform2 = testplatform.create(500,300, 'concrete1')
    platform2.displayWidth = 250;
    platform2.displayHeight = 30;
    platform.refreshBody()
    //sprite
    player1 = this.physics.add.sprite(200,300, 'player1') //adds the sprite based on the physic setting of arcade on the location of x value of 200, and y value of 300
    player1.setBounce(0.2) //Jump value of 0.2
    player1.setCollideWorldBounds(true) //Makes it so they will stay within the boundary of the canvas
    this.physics.add.collider(player1, testplatform) //Collision between the sprite and the platforms
    player1.displayWidth = 50;
    player1.displayHeight = 50
    player2 = this.physics.add.sprite(500, 200, 'player2')
    player2.setBounce(0.2)
    player2.setCollideWorldBounds(true)
    this.physics.add.collider(player2, testplatform)
    player2.displayWidth = 50;
    player2.displayHeight = 50
}

function update() {

}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
